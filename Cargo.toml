[package]
name = "void"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
encoding_rs = "0.8"
futures = "0.3.34"
hostname = "0.4"
irc = { version = "1.1.0", features = ["proxy"] }
mlua = { version = "0.12.0", features = ["lua54", "send", "vendored"] }
ring = "0.17"
rusqlite = { version = "0.35", features = ["bundled-sqlcipher"] }
ratatui = "0.30.2"
shellexpand = "3.1.2"
tokio = { version = "1.53.1", features = ["full"] }
